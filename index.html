<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>DerivPro Glass Trader</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050508;
      --card-bg: rgba(22, 23, 34, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(20px);
      --accent-cyan: #10b981; 
      --accent-red: #ef4444;  
      --accent-blue: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #8388a4;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.light-theme {
      --bg-dark: #f0f4f8;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    .top-bar {
      background: rgba(10, 11, 18, 0.85); backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--card-border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }

    .icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; }
    .acc-balance { font-family: var(--font-mono); font-weight: 700; color: var(--accent-cyan); font-size: 14px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-red); display: inline-block; }
    .status-dot.connected { background: var(--accent-cyan); }

    /* TABS */
    .nav-tabs { background: rgba(12, 13, 20, 0.9); border-bottom: 1px solid var(--card-border); display: flex; }
    .nav-tab { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; flex: 1; text-align: center; }
    .nav-tab.active { color: var(--accent-blue); background: rgba(56, 189, 248, 0.08); border-bottom: 2px solid var(--accent-blue); }

    /* LAYOUT */
    .app-container { flex: 1; padding: 16px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .tab-view { display: none; flex-direction: column; gap: 16px; }
    .tab-view.active { display: flex; }

    .glass-card { background: var(--card-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; }

    /* STATS & BUTTONS */
    .digits-stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .circle-stat { width: 52px; height: 52px; border-radius: 50%; background: rgba(18, 20, 32, 0.5); border: 3px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; }
    .circle-stat.highest { border-color: var(--accent-cyan); }
    .circle-stat.lowest { border-color: var(--accent-red); }
    .circle-stat .num { font-size: 14px; font-weight: 800; }
    .circle-stat .pct { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); }

    .digits-selector-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .digit-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 0; color: var(--text-main); font-weight: 700; cursor: pointer; }
    .digit-btn.active { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .input-box { background: rgba(0, 0, 0, 0.15); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; }
    .input-box label { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .input-box input { width: 100%; background: transparent; border: none; color: var(--text-main); font-family: var(--font-mono); font-weight: 700; font-size: 14px; outline: none; }

    .btn-full { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-deriv { background: #ff444f; color: white; }
    .btn-cyan { background: var(--accent-cyan); color: #000; }
    .btn-red { background: var(--accent-red); color: white; }

    .trades-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
    .trade-log-item { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-size: 12px; }

    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 200; display: none; align-items: flex-end; }
    .modal-drawer { background: var(--bg-dark); border-top: 1px solid var(--card-border); border-radius: 24px 24px 0 0; width: 100%; max-height: 75vh; overflow-y: auto; padding: 20px; }
    .drawer-option { padding: 14px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="icon-btn" onclick="openModal('menuModal')"><i class="fa-solid fa-bars"></i></button>
      <span class="status-dot" id="connectionDot"></span>
    </div>
    <div class="acc-balance" id="accountBalance">Log In Required</div>
  </header>

  <nav class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('manual', this)"><i class="fa-solid fa-chart-line"></i> Manual</div>
    <div class="nav-tab" onclick="switchTab('bot', this)"><i class="fa-solid fa-robot"></i> Auto Bot</div>
  </nav>

  <main class="app-container">
    <div class="glass-card" onclick="openModal('marketModal')" style="cursor:pointer;">
      <div style="font-size: 15px; font-weight: 700;" id="marketName">Volatility 100 (1s) Index</div>
      <div style="font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);" id="livePrice">Connecting...</div>
    </div>

    <!-- MANUAL VIEW -->
    <div id="manualView" class="tab-view active">
      <div class="digits-stats-grid" id="digitsStatsGrid"></div>

      <div class="glass-card">
        <div class="digits-selector-grid" id="digitButtonsGrid"></div>
        <div class="inputs-grid">
          <div class="input-box"><label>Ticks</label><input type="number" id="manualTicks" value="1" /></div>
          <div class="input-box"><label>Stake ($)</label><input type="number" id="manualStake" value="10.00" /></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <button class="btn-full btn-cyan" onclick="sendTrade('DIGITEVEN')">Trade EVEN</button>
          <button class="btn-full btn-red" onclick="sendTrade('DIGITODD')">Trade ODD</button>
        </div>
      </div>

      <div class="glass-card">
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">TRADE LOGS</div>
        <div class="trades-list" id="tradeLog"></div>
      </div>
    </div>

    <!-- BOT VIEW -->
    <div id="botView" class="tab-view">
      <div class="glass-card">
        <h3 style="margin-bottom:12px;">Auto Even/Odd Bot</h3>
        <div class="inputs-grid">
          <div class="input-box"><label>Base Stake ($)</label><input type="number" id="botStake" value="1.00" /></div>
          <div class="input-box"><label>Target Profit ($)</label><input type="number" id="botTP" value="10.00" /></div>
        </div>
        <button class="btn-full btn-cyan" id="botToggleBtn" onclick="toggleBot()">START BOT</button>
      </div>
    </div>
  </main>

  <!-- MODALS -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal-drawer">
      <h3 style="margin-bottom:16px;">Authentication</h3>
      <button class="btn-full btn-deriv" onclick="loginOAuth()" style="margin-bottom:12px;">
        <i class="fa-solid fa-right-to-bracket"></i> Log in with Deriv
      </button>
      <div class="drawer-option" onclick="closeModal('menuModal'); openModal('tokenModal');">
        <span><i class="fa-solid fa-key" style="margin-right:8px;"></i> Manual Token Fallback</span>
      </div>
      <div class="drawer-option" onclick="toggleTheme()"><span>Toggle Light/Dark Theme</span></div>
      <div class="drawer-option" onclick="logout()"><span style="color:var(--accent-red);">Logout</span></div>
    </div>
  </div>

  <div class="modal-overlay" id="tokenModal">
    <div class="modal-drawer">
      <h3 style="margin-bottom:12px;">Paste API Token</h3>
      <div class="input-box" style="margin-bottom:12px;">
        <input type="password" id="manualTokenInput" placeholder="Paste Token Here" />
      </div>
      <button class="btn-full btn-cyan" onclick="saveManualToken()">Save & Connect</button>
    </div>
  </div>

  <div class="modal-overlay" id="marketModal">
    <div class="modal-drawer">
      <h3 style="margin-bottom:12px;">Select Index</h3>
      <div id="marketList"></div>
    </div>
  </div>

  <script>
    // Replace this string with the App ID given by developers.deriv.com
    const DERIV_APP_ID = '1089'; 

    let ws = null;
    const app = {
      token: localStorage.getItem('deriv_token') || '',
      symbol: '1HZ100V',
      currency: 'USD',
      selectedDigit: 5,
      tickHistory: [],
      digitsCounts: Array(10).fill(0),
      botActive: false,
      markets: [
        { name: 'Volatility 100 (1s) Index', symbol: '1HZ100V' },
        { name: 'Volatility 75 (1s) Index', symbol: '1HZ75V' },
        { name: 'Volatility 50 (1s) Index', symbol: '1HZ50V' },
        { name: 'Volatility 25 (1s) Index', symbol: '1HZ25V' },
        { name: 'Volatility 10 (1s) Index', symbol: '1HZ10V' }
      ]
    };

    // OAuth Redirect Token Reader
    function checkOAuthRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const token1 = urlParams.get('token1');
      if (token1) {
        app.token = token1;
        localStorage.setItem('deriv_token', token1);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function loginOAuth() {
      const redirectUrl = window.location.origin + window.location.pathname;
      window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${DERIV_APP_ID}&redirect_uri=${encodeURIComponent(redirectUrl)}`;
    }

    function initWebSocket() {
      ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${DERIV_APP_ID}`);

      ws.onopen = () => {
        document.getElementById('connectionDot').classList.add('connected');
        if (app.token) ws.send(JSON.stringify({ authorize: app.token }));
        subscribeSymbol(app.symbol);
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.msg_type === 'authorize') {
          if (data.error) {
            document.getElementById('accountBalance').innerText = 'Auth Error';
          } else {
            app.currency = data.authorize.currency;
            document.getElementById('accountBalance').innerText = `${parseFloat(data.authorize.balance).toFixed(2)} ${app.currency}`;
            ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          }
        }

        if (data.msg_type === 'balance') {
          document.getElementById('accountBalance').innerText = `${parseFloat(data.balance.balance).toFixed(2)} ${app.currency}`;
        }

        if (data.msg_type === 'tick' && data.tick) {
          const price = data.tick.quote.toFixed(data.tick.pip_size);
          const digit = parseInt(price.slice(-1));
          document.getElementById('livePrice').innerText = price;
          processDigit(digit);
        }
      };

      ws.onclose = () => {
        document.getElementById('connectionDot').classList.remove('connected');
        setTimeout(initWebSocket, 3000);
      };
    }

    function subscribeSymbol(symbol) {
      app.tickHistory = []; app.digitsCounts = Array(10).fill(0);
      ws.send(JSON.stringify({ ticks_history: symbol, adjust_start_time: 1, count: 100, end: 'latest', start: 1, style: 'ticks', subscribe: 1 }));
    }

    function processDigit(digit) {
      app.tickHistory.push(digit);
      if (app.tickHistory.length > 100) app.digitsCounts[app.tickHistory.shift()]--;
      app.digitsCounts[digit]++;
      renderStats();
    }

    function renderStats() {
      const total = app.tickHistory.length || 1;
      let max = -1, min = Infinity, maxD = 0, minD = 0;
      app.digitsCounts.forEach((cnt, i) => {
        if (cnt > max) { max = cnt; maxD = i; }
        if (cnt < min) { min = cnt; minD = i; }
      });

      document.getElementById('digitsStatsGrid').innerHTML = app.digitsCounts.map((cnt, i) => `
        <div style="text-align:center;">
          <div class="circle-stat ${i === maxD ? 'highest' : ''} ${i === minD ? 'lowest' : ''}">
            <span class="num">${i}</span>
            <span class="pct">${((cnt / total) * 100).toFixed(0)}%</span>
          </div>
        </div>
      `).join('');
    }

    function renderDigitSelector() {
      document.getElementById('digitButtonsGrid').innerHTML = Array.from({length: 10}, (_, i) => `
        <button class="digit-btn ${app.selectedDigit === i ? 'active' : ''}" onclick="app.selectedDigit=${i}; renderDigitSelector();">${i}</button>
      `).join('');
    }

    function sendTrade(type) {
      if (!app.token) return alert('Log in from menu (☰)!');
      const stake = parseFloat(document.getElementById('manualStake').value);
      const ticks = parseInt(document.getElementById('manualTicks').value);

      ws.send(JSON.stringify({
        buy: 1, price: stake,
        parameters: { amount: stake, basis: 'stake', contract_type: type, currency: app.currency, duration: ticks, duration_unit: 't', symbol: app.symbol }
      }));
    }

    function saveManualToken() {
      const val = document.getElementById('manualTokenInput').value.trim();
      if (val) { app.token = val; localStorage.setItem('deriv_token', val); closeModal('tokenModal'); ws.send(JSON.stringify({ authorize: app.token })); }
    }

    function logout() { localStorage.removeItem('deriv_token'); location.reload(); }
    function switchTab(tab, el) {
      document.querySelectorAll('.nav-tab').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tab-view').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tab + 'View').classList.add('active');
    }
    function toggleTheme() { document.body.classList.toggle('light-theme'); closeModal('menuModal'); }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function renderMarkets() {
      document.getElementById('marketList').innerHTML = app.markets.map(m => `
        <div class="drawer-option" onclick="app.symbol='${m.symbol}'; document.getElementById('marketName').innerText='${m.name}'; subscribeSymbol('${m.symbol}'); closeModal('marketModal');">
          <span>${m.name}</span>
        </div>
      `).join('');
    }

    checkOAuthRedirect();
    renderDigitSelector();
    renderMarkets();
    initWebSocket();
  </script>
</body>
</html>
