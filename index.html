<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DerivPro - Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --accent: #00d4ff;
      --green: #00ff88;
      --red: #ff4444;
      --text: #ffffff;
      --muted: #8888aa;
      --border: #2a2a4a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--green);
    }

    .tagline {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 30px;
    }

    .login-box h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input, 
    .input-group select {
      width: 100%;
      padding: 12px 15px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0099cc);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--green), #00cc66);
      color: #000;
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--red), #cc0000);
      color: #fff;
    }

    .btn-warning {
      background: linear-gradient(135deg, #ffaa00, #ff8800);
      color: #000;
    }

    .btn-small {
      width: auto;
      padding: 8px 16px;
      font-size: 12px;
      border-radius: 8px;
    }

    .disclaimer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .error-msg {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    .loading-msg {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    /* ===== MAIN APP ===== */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-size: 20px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .header-logo span {
      color: var(--green);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .balance-display {
      text-align: right;
    }

    .balance-display .amount {
      font-size: 18px;
      font-weight: 700;
      color: var(--green);
    }

    .balance-display .currency {
      font-size: 11px;
      color: var(--muted);
    }

    .account-badge {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .logout-btn {
      background: rgba(255, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: var(--red);
      color: #fff;
    }

    /* ===== NAV TABS ===== */
    .nav-tabs {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 0 20px;
    }

    .nav-tab {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .nav-tab:hover {
      color: var(--text);
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      padding: 20px;
      flex: 1;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* ===== CARDS ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    /* ===== STATS GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
    }

    .stat-card .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 22px;
      font-weight: 800;
    }

    .stat-card .value.green { color: var(--green); }
    .stat-card .value.red { color: var(--red); }
    .stat-card .value.blue { color: var(--accent); }
    .stat-card .value.white { color: var(--text); }

    /* ===== TRADING SECTION ===== */
    .market-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 15px;
      padding-bottom: 5px;
    }

    .market-btn {
      padding: 8px 16px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .market-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .price-display {
      background: var(--card2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }

    .price-display .symbol {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .price-display .price {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent);
      font-family: monospace;
    }

    .price-display .change {
      font-size: 13px;
      margin-top: 5px;
    }

    .trade-form {
      display: grid;
      gap: 12px;
    }

    .trade-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 5px;
    }

    .trade-btn-rise {
      background: linear-gradient(135deg, var(--green), #00aa55);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
    }

    .trade-btn-fall {
      background: linear-gradient(135deg, var(--red), #cc0000);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
    }

    .trade-btn-rise:hover, 
    .trade-btn-fall:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* ===== OPEN TRADES ===== */
    .trade-item {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trade-item .trade-info .symbol {
      font-size: 14px;
      font-weight: 700;
    }

    .trade-item .trade-info .details {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }
