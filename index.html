<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>DerivPro Glass Trader</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050508;
      --card-bg: rgba(22, 23, 34, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(20px);
      --accent-cyan: #10b981; 
      --accent-red: #ef4444;  
      --accent-blue: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #8388a4;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    .top-bar {
      background: rgba(10, 11, 18, 0.85); backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--card-border); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }

    .icon-btn { background: transparent; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; }
    .acc-balance { font-family: var(--font-mono); font-weight: 700; color: var(--accent-cyan); font-size: 14px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-red); display: inline-block; }
    .status-dot.connected { background: var(--accent-cyan); }

    .app-container { flex: 1; padding: 16px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    
    .glass-card {
      background: var(--card-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border); border-radius: 20px; padding: 16px;
    }

    .btn-full { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-deriv { background: #ff444f; color: white; }
    .btn-cyan { background: var(--accent-cyan); color: #000; }

    .digits-stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .circle-stat { width: 52px; height: 52px; border-radius: 50%; background: rgba(18, 20, 32, 0.5); border: 3px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; }
    .circle-stat.highest { border-color: var(--accent-cyan); }
    .circle-stat.lowest { border-color: var(--accent-red); }
    .circle-stat .num { font-size: 14px; font-weight: 800; }
    .circle-stat .pct { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    .input-box { background: rgba(0, 0, 0, 0.15); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; }
    .input-box label { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .input-box input { width: 100%; background: transparent; border: none; color: var(--text-main); font-family: var(--font-mono); font-weight: 700; font-size: 14px; outline: none; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 200; display: none; align-items: flex-end; }
    .modal-drawer { background: var(--bg-dark); border-top: 1px solid var(--card-border); border-radius: 24px 24px 0 0; width: 100%; max-height: 75vh; overflow-y: auto; padding: 20px; }
    .drawer-option { padding: 14px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="icon-btn" onclick="openModal('menuModal')"><i class="fa-solid fa-bars"></i></button>
      <span class="status-dot" id="connectionDot"></span>
    </div>
    <div class="acc-balance" id="accountBalance">Login Required</div>
  </header>

  <main class="app-container">
    <!-- MARKET HEADER -->
    <div class="glass-card">
      <div style="font-size: 15px; font-weight: 700;" id="marketName">Volatility 100 (1s) Index</div>
      <div style="font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);" id="livePrice">Connecting...</div>
    </div>

    <!-- STATS -->
    <div class="digits-stats-grid" id="digitsStatsGrid"></div>

    <!-- CONTROLS -->
    <div class="glass-card">
      <div class="inputs-grid">
        <div class="input-box"><label>Ticks</label><input type="number" id="manualTicks" value="1" /></div>
        <div class="input-box"><label>Stake ($)</label><input type="number" id="manualStake" value="10.00" /></div>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <button class="btn-full btn-cyan" onclick="sendTrade('DIGITEVEN')">Trade EVEN</button>
        <button class="btn-full btn-deriv" onclick="sendTrade('DIGITODD')">Trade ODD</button>
      </div>
    </div>
  </main>

  <!-- MENU MODAL -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal-drawer">
      <h3 style="margin-bottom: 16px;">Account Authentication</h3>

      <!-- 1-CLICK DERIV OAUTH LOGIN -->
      <button class="btn-full btn-deriv" onclick="loginWithDeriv()" style="margin-bottom: 12px;">
        <i class="fa-solid fa-right-to-bracket"></i> Direct Log in with Deriv
      </button>

      <!-- MANUAL TOKEN BACKUP -->
      <div class="drawer-option" onclick="closeModal('menuModal'); openModal('tokenModal');">
        <span><i class="fa-solid fa-key" style="margin-right:10px; color:var(--accent-blue);"></i> Manual API Token</span>
        <span style="font-size:12px; color:var(--text-muted);" id="tokenStatus">Not Configured</span>
      </div>

      <div class="drawer-option" onclick="logoutDeriv()">
        <span style="color:var(--accent-red);"><i class="fa-solid fa-power-off" style="margin-right:10px;"></i> Logout</span>
      </div>
    </div>
  </div>

  <!-- MANUAL TOKEN MODAL -->
  <div class="modal-overlay" id="tokenModal">
    <div class="modal-drawer">
      <h3 style="margin-bottom:12px;">Set Manual Token</h3>
      <div class="input-box" style="margin-bottom:12px;">
        <label>API Token</label>
        <input type="password" id="derivTokenInput" placeholder="Paste Token Here" />
      </div>
      <button class="btn-full btn-cyan" onclick="saveManualToken()">Save Token</button>
    </div>
  </div>

  <script>
    const DERIV_APP_ID = '1089'; 
    let ws = null;

    const app = {
      token: localStorage.getItem('deriv_token') || '',
      symbol: '1HZ100V',
      balance: 0,
      currency: 'USD',
      tickHistory: [],
      digitsCounts: Array(10).fill(0)
    };

    // Auto-catch Token if returning from OAuth Login Redirect
    function checkOAuthRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const token1 = urlParams.get('token1');
      if (token1) {
        app.token = token1;
        localStorage.setItem('deriv_token', token1);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function loginWithDeriv() {
      // Official OAuth2 Authorize Link
      const redirectUrl = window.location.href.split('?')[0];
      window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${DERIV_APP_ID}&redirect_uri=${encodeURIComponent(redirectUrl)}`;
    }

    function initWebSocket() {
      ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${DERIV_APP_ID}`);

      ws.onopen = () => {
        document.getElementById('connectionDot').classList.add('connected');
        if (app.token) {
          document.getElementById('tokenStatus').innerText = "Active";
          ws.send(JSON.stringify({ authorize: app.token }));
        } else {
          document.getElementById('accountBalance').innerText = 'Log In First';
        }
        ws.send(JSON.stringify({ ticks_history: app.symbol, adjust_start_time: 1, count: 100, end: 'latest', start: 1, style: 'ticks', subscribe: 1 }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'authorize') {
          if (data.error) {
            document.getElementById('accountBalance').innerText = 'Auth Error';
            document.getElementById('tokenStatus').innerText = "Invalid";
          } else {
            app.balance = parseFloat(data.authorize.balance);
            app.currency = data.authorize.currency;
            document.getElementById('accountBalance').innerText = `${app.balance.toFixed(2)} ${app.currency}`;
            ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          }
        }

        if (data.msg_type === 'balance' && data.balance) {
          app.balance = parseFloat(data.balance.balance);
          document.getElementById('accountBalance').innerText = `${app.balance.toFixed(2)} ${app.currency}`;
        }

        if (data.msg_type === 'tick' && data.tick) {
          const priceStr = data.tick.quote.toFixed(data.tick.pip_size);
          const lastDigit = parseInt(priceStr.slice(-1));
          document.getElementById('livePrice').innerText = priceStr;
          processDigit(lastDigit);
        }
      };

      ws.onclose = () => {
        document.getElementById('connectionDot').classList.remove('connected');
        setTimeout(initWebSocket, 3000);
      };
    }

    function processDigit(digit) {
      app.tickHistory.push(digit);
      if (app.tickHistory.length > 100) {
        const removed = app.tickHistory.shift();
        app.digitsCounts[removed]--;
      }
      app.digitsCounts[digit]++;
      renderStats();
    }

    function renderStats() {
      const total = app.tickHistory.length || 1;
      let maxVal = -1, minVal = Infinity, maxDigit = 0, minDigit = 0;
      app.digitsCounts.forEach((cnt, idx) => {
        if (cnt > maxVal) { maxVal = cnt; maxDigit = idx; }
        if (cnt < minVal) { minVal = cnt; minDigit = idx; }
      });

      document.getElementById('digitsStatsGrid').innerHTML = app.digitsCounts.map((cnt, idx) => `
        <div style="text-align:center;">
          <div class="circle-stat ${idx === maxDigit ? 'highest' : ''} ${idx === minDigit ? 'lowest' : ''}">
            <span class="num">${idx}</span>
            <span class="pct">${((cnt / total) * 100).toFixed(0)}%</span>
          </div>
        </div>
      `).join('');
    }

    function sendTrade(type) {
      if (!app.token) return alert('Please Log in first from the top-left menu (☰)!');
      ws.send(JSON.stringify({
        buy: 1,
        price: parseFloat(document.getElementById('manualStake').value),
        parameters: {
          amount: parseFloat(document.getElementById('manualStake').value),
          basis: 'stake', contract_type: type, currency: app.currency,
          duration: parseInt(document.getElementById('manualTicks').value),
          duration_unit: 't', symbol: app.symbol
        }
      }));
    }

    function saveManualToken() {
      const val = document.getElementById('derivTokenInput').value.trim();
      if (val) {
        app.token = val;
        localStorage.setItem('deriv_token', val);
        closeModal('tokenModal');
        ws.send(JSON.stringify({ authorize: app.token }));
      }
    }

    function logoutDeriv() {
      localStorage.removeItem('deriv_token');
      app.token = '';
      location.reload();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    checkOAuthRedirect();
    initWebSocket();
  </script>
</body>
</html>
